<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:23px;font-weight:700}.s{font-size:15px}.b{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text x="45" y="45" class="t">Ingestion Pipeline</text>
<g>
<rect x="40" y="120" width="145" height="75" rx="10" class="b"/><text x="112" y="150" text-anchor="middle" class="t">GitHub</text><text x="112" y="176" text-anchor="middle" class="s">REST API</text>
<rect x="235" y="120" width="155" height="75" rx="10" class="b"/><text x="312" y="150" text-anchor="middle" class="t">Checkpoint</text><text x="312" y="176" text-anchor="middle" class="s">safe windows</text>
<rect x="440" y="120" width="155" height="75" rx="10" class="b"/><text x="517" y="150" text-anchor="middle" class="t">Pagination</text><text x="517" y="176" text-anchor="middle" class="s">window splitting</text>
<rect x="645" y="120" width="155" height="75" rx="10" class="b"/><text x="722" y="150" text-anchor="middle" class="t">Normalize</text><text x="722" y="176" text-anchor="middle" class="s">shared DTO</text>
<rect x="850" y="120" width="145" height="75" rx="10" class="b"/><text x="922" y="150" text-anchor="middle" class="t">Pre-filter</text><text x="922" y="176" text-anchor="middle" class="s">deterministic</text>
<rect x="1040" y="120" width="130" height="75" rx="10" class="b"/><text x="1105" y="150" text-anchor="middle" class="t">Enrich</text><text x="1105" y="176" text-anchor="middle" class="s">README + web</text>
</g>
<path d="M185 157H235M390 157H440M595 157H645M800 157H850M995 157H1040" class="a"/>
<text x="235" y="260" class="s">Checkpoint advances only after a complete successful window.</text>
<text x="235" y="292" class="s">Overlap + idempotent upserts prevent gaps without creating duplicates.</text>
<text x="235" y="324" class="s">Rate limits, bounded retries and queue isolation keep acquisition reliable.</text>
</svg>